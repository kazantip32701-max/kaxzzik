<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balls Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:#070712;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}
.top {
  width:100%;
  max-width:420px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px 6px;
}
.user { display:flex; align-items:center; gap:8px; }
.avatar { width:36px; height:36px; border-radius:50%; background:#222; object-fit:cover; border:2px solid #00c8ff; }
.balance {
  background:rgba(0,200,255,0.12);
  border:1px solid #00c8ff;
  border-radius:12px;
  padding:6px 12px;
  font-size:14px;
  color:#00e0ff;
  font-weight:700;
}
canvas { background:#0a0a18; max-width:100%; touch-action:none; }
.controls {
  width:100%;
  max-width:420px;
  padding:10px 12px 16px;
  background:linear-gradient(transparent, #070712 40%);
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
}
.info { font-size:13px; opacity:0.9; text-align:center; min-height:20px; }
.bet-buttons {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}
.bet-buttons button {
  background:#16162a;
  border:1px solid #00c8ff;
  color:#fff;
  border-radius:12px;
  padding:8px 12px;
  font-weight:700;
  font-size:14px;
  min-width:70px;
}
.bet-buttons button:disabled { opacity:0.4; }
.price { font-size:11px; opacity:0.7; }
.bonus-btn {
  background:linear-gradient(180deg,#ffcc00,#ff9900);
  color:#000;
  border:none;
  border-radius:12px;
  padding:8px 16px;
  font-weight:700;
  font-size:14px;
}
.timer { font-size:15px; font-weight:600; color:#ffcc00; }
.lobby-balls {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:360px;
  min-height:40px;
}
.lobby-ball {
  width:28px; height:28px;
  border-radius:50%;
  border:2px solid #fff;
  object-fit:cover;
}
</style>
</head>
<body>
<div class="top">
  <div class="user">
    <img id="avatar" class="avatar" src="" alt="">
    <div>
      <div id="username" style="font-weight:700;font-size:15px;">...</div>
      <div id="streak" style="font-size:11px;opacity:0.7;">Серия: 0</div>
    </div>
  </div>
  <div class="balance" id="balance">0.00 USDT</div>
</div>
<canvas id="canvas" width="390" height="520"></canvas>
<div class="controls">
  <div class="info" id="info">Загрузка...</div>
  <div class="lobby-balls" id="lobbyBalls"></div>
  <button class="bonus-btn" id="bonusBtn" style="display:none;">Забрать бонус</button>
  <div class="bet-buttons">
    <button id="bet1" data-count="1">1 шар<br><span class="price">0.10$</span></button>
    <button id="bet3" data-count="3">3 шара<br><span class="price">0.30$</span></button>
    <button id="bet5" data-count="5">5 шаров<br><span class="price">0.50$</span></button>
    <button id="bet10" data-count="10">10 шаров<br><span class="price">1.00$</span></button>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px;">
    <button id="camFree" style="background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:10px;">Свободно</button>
    <button id="camFollow" style="background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:10px;">За мной</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#070712');
  tg.setBackgroundColor('#070712');
}

const API = 'https://kaxzzik-1.onrender.com';
let initData = tg?.initData || '';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const VIEW_H = canvas.height;
const WORLD_H = 5200;

let balls = [];
let obstacles = [];
let mills = [];
let running = false;
let winner = null;
let cameraY = 0;
let freeCam = true;
let followMe = false;
let myBalls = [];
let balance = 0;
let nextRound = Date.now() + 30000;
let currentMap = 0;
let me = null;
const BALL_PRICE = 0.10;
const MAX_BALLS = 10;

const maps = [
  { name: 'Неон', colors: ['#00c8ff','#00aaff','#0088ff'] },
  { name: 'Огонь', colors: ['#ff6600','#ff3300','#ff9900'] },
  { name: 'Токсик', colors: ['#66ff66','#00ff88','#aaff00'] }
];

async function api(path, body = {}) {
  try {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, initData })
    });
    return await res.json();
  } catch(e) {
    return { error: 'Сеть' };
  }
}

async function loadMe() {
  if (!initData) {
    document.getElementById('info').textContent = 'Открой через Telegram';
    return;
  }
  const data = await api('/api/me');
  if (data.error) {
    document.getElementById('info').textContent = 'Ошибка авторизации';
    return;
  }
  me = data;
  balance = data.balance;
  document.getElementById('balance').textContent = balance.toFixed(2) + ' USDT';
  document.getElementById('username').textContent = data.first_name || data.username || 'Игрок';
  document.getElementById('streak').textContent = 'Серия: ' + data.streak;
  if (data.photo_url) document.getElementById('avatar').src = data.photo_url;
  const bonusBtn = document.getElementById('bonusBtn');
  if (data.canClaimBonus) {
    bonusBtn.style.display = 'block';
    bonusBtn.textContent = `Бонус +${data.nextBonusAmount.toFixed(2)}`;
  } else bonusBtn.style.display = 'none';
  updateBetButtons();
}

function updateBetButtons() {
  const myCount = myBalls.length;
  document.querySelectorAll('.bet-buttons button').forEach(btn => {
    const count = parseInt(btn.dataset.count);
    btn.disabled = (myCount + count > MAX_BALLS) || (balance < count * BALL_PRICE);
  });
}

function updateLobby() {
  const container = document.getElementById('lobbyBalls');
  container.innerHTML = '';
  balls.forEach(b => {
    const img = document.createElement('img');
    img.className = 'lobby-ball';
    img.src = b.photo || '';
    img.style.borderColor = b.color;
    img.title = b.name;
    container.appendChild(img);
  });
}

function createWorld() {
  obstacles = [];
  mills = [];
  obstacles.push({type:'gate', y:200, open:false});
  const map = maps[currentMap % maps.length];
  for (let i = 0; i < 34; i++) {
    const y = 320 + i * 145;
    const r = Math.random();
    const col = map.colors[Math.floor(Math.random()*map.colors.length)];
    if (r < 0.25) {
      obstacles.push({type:'arc', x:40+Math.random()*310, y, r:35+Math.random()*70, start:Math.random()*Math.PI*2, end:Math.random()*Math.PI*2+1.2, color:col});
    } else if (r < 0.45) {
      obstacles.push({type:'line', x1:5+Math.random()*20, y1:y, x2:300+Math.random()*80, y2:y+(Math.random()-0.5)*40, color:col});
    } else if (r < 0.65) {
      obstacles.push({type:'pipe', x:20+Math.random()*300, y, w:28, h:60+Math.random()*80, color:col, spin: Math.random()>0.5});
    } else if (r < 0.8) {
      mills.push({x:60+Math.random()*270, y, r:45+Math.random()*30, angle:Math.random()*6, speed:0.008+Math.random()*0.015, blades:4});
    } else {
      obstacles.push({type:'cube', x:50+Math.random()*290, y, size:40+Math.random()*30, angle:0, speed:0.01+Math.random()*0.01, color:col});
    }
  }
  obstacles.push({type:'finish', y:WORLD_H - 60});
}

async function placeBet(count) {
  if (myBalls.length + count > MAX_BALLS) return;
  const cost = count * BALL_PRICE;
  if (balance < cost) {
    document.getElementById('info').textContent = 'Недостаточно средств';
    tg?.HapticFeedback?.notificationOccurred('error');
    return;
  }
  const res = await api('/api/bet', { amount: cost });
  if (!res.success) {
    document.getElementById('info').textContent = res.error || 'Ошибка';
    return;
  }
  balance = res.balance;
  document.getElementById('balance').textContent = balance.toFixed(2) + ' USDT';
  tg?.HapticFeedback?.impactOccurred('medium');

  for (let i = 0; i < count; i++) {
    const b = {
      x: 30 + Math.random()*(W-60),
      y: 30 + Math.random()*40,
      vx: (Math.random()-0.5)*0.3,
      vy: 0,
      r: 12,
      color: '#00f0ff',
      finished: false,
      isMine: true,
      name: me?.first_name || 'Ты',
      photo: me?.photo_url
    };
    balls.push(b);
    myBalls.push(b);
  }
  updateLobby();
  updateBetButtons();
  document.getElementById('info').textContent = `Твои шары: ${myBalls.length}/${MAX_BALLS}`;
}

async function claimBonus() {
  const res = await api('/api/claim-bonus');
  if (res.success) {
    balance = res.balance;
    document.getElementById('balance').textContent = balance.toFixed(2) + ' USDT';
    document.getElementById('bonusBtn').style.display = 'none';
    document.getElementById('streak').textContent = 'Серия: ' + res.streak;
    document.getElementById('info').textContent = `Бонус +${res.amount.toFixed(2)}!`;
    tg?.HapticFeedback?.notificationOccurred('success');
    updateBetButtons();
  }
}

function dist(a,b,c,d){ return Math.hypot(c-a,d-b); }

function update() {
  const now = Date.now();
  const left = Math.max(0, Math.ceil((nextRound - now)/1000));

  if (!running) {
    document.getElementById('info').innerHTML = balls.length 
      ? `Старт через <span class="timer">${left}с</span> • Шаров: ${balls.length}`
      : `Ожидание ставок • Старт через <span class="timer">${left}с</span>`;
  }

  if (!running && left <= 0 && balls.length > 0) {
    running = true;
    const gate = obstacles.find(o=>o.type==='gate');
    if (gate) gate.open = true;
    document.getElementById('info').textContent = 'Раунд идёт...';
    document.querySelectorAll('.bet-buttons button').forEach(b => b.disabled = true);
  }

  if (!running) return;

  const g = 0.018;
  const bounce = 0.72;
  mills.forEach(m => m.angle += m.speed);
  obstacles.forEach(o => { if (o.type==='cube') o.angle += o.speed; });

  balls.forEach(b => {
    if (b.finished) return;
    b.vy += g;
    b.vx *= 0.996;
    b.vy *= 0.996;
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < b.r) { b.x = b.r; b.vx *= -bounce; }
    if (b.x > W-b.r) { b.x = W-b.r; b.vx *= -bounce; }

    const gate = obstacles.find(o=>o.type==='gate');
    if (gate && !gate.open && b.y + b.r > gate.y - 6) {
      b.y = gate.y - b.r - 3;
      b.vy *= -0.15;
    }

    if (b.y > WORLD_H - 70 && !b.finished) {
      b.finished = true;
      if (!winner) {
        winner = b;
        running = false;
        const pot = balls.length * BALL_PRICE * 0.95;
        document.getElementById('info').innerHTML = b.isMine 
          ? `<b style="color:#00ff88">Победа! +${pot.toFixed(2)} USDT</b>`
          : `Победитель: ${b.name}`;
        setTimeout(resetRound, 3500);
      }
    }

    // collisions
    obstacles.forEach(o => {
      if (o.type==='arc') {
        const d = dist(b.x,b.y,o.x,o.y);
        if (d < o.r + b.r && d > o.r - b.r - 8) {
          const ang = Math.atan2(b.y-o.y, b.x-o.x);
          const nx=Math.cos(ang), ny=Math.sin(ang);
          const dot = b.vx*nx + b.vy*ny;
          b.vx -= 2*dot*nx*bounce;
          b.vy -= 2*dot*ny*bounce;
          b.x = o.x + nx*(o.r+b.r+1);
          b.y = o.y + ny*(o.r+b.r+1);
        }
      }
    });
  });

  if (followMe && myBalls.length) {
    const meBall = myBalls.find(b=>!b.finished) || myBalls[0];
    cameraY = Math.max(0, Math.min(WORLD_H-VIEW_H, meBall.y - VIEW_H*0.32));
  } else if (running) {
    const active = balls.filter(b=>!b.finished);
    if (active.length) {
      const avg = active.reduce((s,b)=>s+b.y,0)/active.length;
      cameraY += (Math.max(0, Math.min(WORLD_H-VIEW_H, avg - VIEW_H*0.38)) - cameraY) * 0.04;
    }
  }
}

function draw() {
  ctx.clearRect(0,0,W,VIEW_H);
  ctx.save();
  ctx.translate(0, -cameraY);

  ctx.fillStyle = '#0c0c1e';
  ctx.fillRect(0,0,W,WORLD_H);

  mills.forEach(m => {
    ctx.strokeStyle = '#88eeff';
    ctx.lineWidth = 5;
    for (let a=0; a<m.blades; a++) {
      const ang = m.angle + a*(Math.PI*2/m.blades);
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x+Math.cos(ang)*m.r, m.y+Math.sin(ang)*m.r);
      ctx.stroke();
    }
  });

  obstacles.forEach(o => {
    if (o.type==='gate' && !o.open) {
      const g = ctx.createLinearGradient(0,o.y-10,0,o.y+10);
      g.addColorStop(0,'#00e8ff');
      g.addColorStop(1,'#004466');
      ctx.fillStyle = g;
      ctx.fillRect(0, o.y-8, W, 16);
      return;
    }
    if (o.type==='finish') {
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 4;
      ctx.setLineDash([12,8]);
      ctx.beginPath();
      ctx.moveTo(0,o.y); ctx.lineTo(W,o.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ФИНИШ', W/2, o.y-12);
      return;
    }
    ctx.strokeStyle = o.color;
    ctx.lineWidth = 5;
    if (o.type==='arc') {
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,o.start,o.end);
      ctx.stroke();
    } else if (o.type==='line') {
      ctx.beginPath();
      ctx.moveTo(o.x1,o.y1); ctx.lineTo(o.x2,o.y2); ctx.stroke();
    } else if (o.type==='pipe') {
      ctx.strokeRect(o.x,o.y,o.w,o.h);
    } else if (o.type==='cube') {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.angle);
      ctx.strokeRect(-o.size/2, -o.size/2, o.size, o.size);
      ctx.restore();
    }
  });

  balls.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (b === winner) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  });

  ctx.restore();
}

function resetRound() {
  running = false;
  winner = null;
  balls = [];
  myBalls = [];
  currentMap = (currentMap + 1) % maps.length;
  createWorld();
  nextRound = Date.now() + 45000;
  document.getElementById('lobbyBalls').innerHTML = '';
  updateBetButtons();
  loadMe();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.querySelectorAll('.bet-buttons button').forEach(btn => {
  btn.onclick = () => placeBet(parseInt(btn.dataset.count));
});
document.getElementById('bonusBtn').onclick = claimBonus;
document.getElementById('camFree').onclick = () => { freeCam=true; followMe=false; };
document.getElementById('camFollow').onclick = () => { freeCam=false; followMe=true; };

let dragging=false, startY=0, startCam=0;
canvas.addEventListener('pointerdown', e=>{ if(!freeCam)return; dragging=true; startY=e.clientY; startCam=cameraY; });
canvas.addEventListener('pointermove', e=>{ if(!dragging||!freeCam)return; cameraY=Math.max(0,Math.min(WORLD_H-VIEW_H, startCam-(e.clientY-startY)*1.5)); });
canvas.addEventListener('pointerup', ()=>dragging=false);

createWorld();
loadMe();
</script>
</body>
</html>
